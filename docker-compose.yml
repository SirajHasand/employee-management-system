version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432        # internal container port stays the same
      - DB_USER=postgres
      - DB_PASSWORD=post123
      - DB_DATABASE=employee_db
    depends_on:
      - postgres
    restart: unless-stopped
    command: >
      sh -c "sleep 10 && npm start"

  postgres:
    image: postgres:13-alpine
    environment:
      - POSTGRES_DB=employee_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=post123
    ports:
      - "5433:5432"        # changed host port to 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres_data: